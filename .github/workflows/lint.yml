name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --shell=sh backup-loop.sh verify-backups.sh tests/test-token-type.sh
      - name: Reject invalid boolean configuration
        run: |
          for name in GH_ORGANIZATION INCLUDE_PRIVATE INCLUDE_FORKS VERIFY_LFS ALIGN_SCHEDULE; do
            for value in True yes 1 ''; do
              if output="$(env GH_ACCOUNT=ci "$name=$value" sh ./backup-loop.sh 2>&1)"; then
                echo "Expected startup failure for $name='$value'" >&2
                exit 1
              fi
              expected="ERROR: $name must be 'true' or 'false', got '$value'"
              if ! printf '%s\n' "$output" | grep -Fq "$expected"; then
                echo "Unexpected error for $name='$value': $output" >&2
                exit 1
              fi
            done
          done
      - name: Test schedule alignment and running markers
        run: sh tests/test-backup-loop.sh
      - name: Verify fail-closed test detects a bypass mutation
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/tests"
          cp backup-loop.sh "$tmp/backup-loop.sh"
          cp tests/test-backup-loop.sh "$tmp/tests/test-backup-loop.sh"
          # Deliberately suppress a failed marker write in an isolated copy.
          python3 - "$tmp/backup-loop.sh" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          original = path.read_text()
          faulty = """    if ! touch "$LAST_START" "$RUNNING"; then
        warn "ERROR: cannot update $LAST_START and $RUNNING; refusing to start an untracked backup"
        exit 1
    fi"""
          assert original.count(faulty) == 1, "fail-closed block changed; update mutation test"
          path.write_text(original.replace(faulty, '    touch "$LAST_START" "$RUNNING" || true'))
          PY
          if output="$(cd "$tmp" && sh tests/test-backup-loop.sh 2>&1)"; then
            echo "Mutation escaped fail-closed regression test" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Fq "FAIL: backup ran without a usable activity marker"; then
            echo "Mutated test failed for an unrelated reason: $output" >&2
            exit 1
          fi
      - name: Test fine/classic token flags and validation
        run: sh tests/test-token-type.sh
      - name: Verify repository and wiki mirrors (regression)
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/source"
          git -C "$tmp/source" -c user.name=CI -c user.email=ci@example.invalid commit --allow-empty -qm initial
          mkdir -p "$tmp/backup/repositories/example"
          git clone --mirror -q "$tmp/source" "$tmp/backup/repositories/example/repository"
          git clone --mirror -q "$tmp/source" "$tmp/backup/repositories/example/wiki"
          printf '{}\n' > "$tmp/backup/repositories/example/metadata.json"
          # A dangling (not corrupt) blob should not pollute verification logs.
          printf 'orphan\n' | git --git-dir="$tmp/backup/repositories/example/repository" hash-object -w --stdin > /dev/null
          # Simulate a host where 'python' is unavailable but 'python3' exists.
          mkdir -p "$tmp/no-python-bin"
          printf '#!/bin/sh\necho "Unexpected python alias used" >&2\nexit 91\n' > "$tmp/no-python-bin/python"
          chmod +x "$tmp/no-python-bin/python"
          output="$(PATH="$tmp/no-python-bin:$PATH" BACKUP_ROOT="$tmp/backup" VERIFY_LFS=false sh ./verify-backups.sh 2>&1)"
          printf '%s\n' "$output" | grep -Fq "Backup verification completed successfully."
          printf '%s\n' "$output" | grep -Fq "/wiki ==="
          if printf '%s\n' "$output" | grep -Fq 'dangling blob'; then
            echo 'Unexpected dangling-object warning in healthy mirror' >&2
            exit 1
          fi
          # A broken wiki ref must cause the overall verification to fail.
          printf '%040d\n' 0 > "$tmp/backup/repositories/example/wiki/refs/heads/broken"
          if BACKUP_ROOT="$tmp/backup" VERIFY_LFS=false sh ./verify-backups.sh; then
            echo 'Expected verification to fail for a corrupted wiki' >&2
            exit 1
          fi
      - name: Validate compose file
        run: |
          cp github-to-nas-backup.env.example github-to-nas-backup.env
          mkdir -p secrets && touch secrets/github_token
          docker compose --env-file ./github-to-nas-backup.env -f docker-compose.yaml -p ci config --quiet
          # Check BOTH CLI interpolation and the application env_file.
          docker compose --env-file ./github-to-nas-backup.env -f docker-compose.yaml -p ci config --format json | jq -e '
            .services["github-to-nas-backup"] as $service |
            ($service.image == "ghcr.io/josegonzalez/python-github-backup:latest") and
            ($service.logging.driver == "json-file") and
            ($service.logging.options["max-size"] == "10m") and
            ($service.logging.options["max-file"] == "5") and
            ($service.healthcheck.test[0] == "CMD-SHELL") and
            ($service.healthcheck.test[1] | contains("/data/status/last-success")) and
            ($service.healthcheck.test[1] | contains("$(date +%s)")) and
            ($service.healthcheck.test[1] | contains("${BACKUP_INTERVAL:-21600}")) and
            ($service.environment.GH_ACCOUNT == "your-github-user-or-organization") and
            (any($service.volumes[]; .target == "/data" and .source == "/absolute/path/to/backup/storage"))
          '
      - name: Test backup freshness healthcheck
        run: |
          # Extract the FINAL shell command after Compose has processed the $$ escapes.
          cmd="$(docker compose --env-file ./github-to-nas-backup.env -f docker-compose.yaml -p ci config --format json | jq -r '.services["github-to-nas-backup"].healthcheck.test[1]')"
          # docker compose config can re-escape $ as $$ for round-trip safety.
          # Normalize the extracted command before executing it with sh.
          cmd="$(printf '%s\n' "$cmd" | sed 's/\$\$/\$/g')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cmd="$(printf '%s\n' "$cmd" | sed "s#/data/status/last-success#$tmp/last-success#g")"
          if BACKUP_INTERVAL=21600 sh -c "$cmd"; then
            echo 'Missing success marker incorrectly reported healthy' >&2
            exit 1
          fi
          touch "$tmp/last-success"
          BACKUP_INTERVAL=21600 sh -c "$cmd"
          # Five-minute-old backups are healthy at 10-minute intervals,
          # but too old when the interval is only 60 seconds.
          touch -d '5 minutes ago' "$tmp/last-success"
          BACKUP_INTERVAL=600 sh -c "$cmd"
          if BACKUP_INTERVAL=60 sh -c "$cmd"; then
            echo 'Stale success marker incorrectly reported healthy' >&2
            exit 1
          fi
          touch -d '1 hour' "$tmp/last-success"
          if BACKUP_INTERVAL=21600 sh -c "$cmd"; then
            echo 'Future success marker incorrectly reported healthy' >&2
            exit 1
          fi
