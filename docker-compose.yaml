services:
  github-to-nas-backup:
    # Pin to a release tag (or digest) for reproducible flags; bump deliberately.
    # Tags: https://github.com/josegonzalez/python-github-backup/pkgs/container/python-github-backup
    image: ghcr.io/josegonzalez/python-github-backup:${BACKUP_IMAGE_TAG:-latest}
    container_name: github-to-nas-backup
    restart: unless-stopped
    # Bound container stdout/stderr log growth independently of daemon defaults.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Health describes freshness of the last successful backup (not a running
    # job or independent verification). Give the first full backup time to finish.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          f=/data/status/last-success;
          [ -f "$$f" ] &&
          age=$$(( $$(date +%s) - $$(stat -c %Y "$$f") )) &&
          [ "$$age" -ge 0 ] &&
          [ "$$age" -lt $$(( 3 * $${BACKUP_INTERVAL:-21600} )) ]
      interval: 15m
      timeout: 10s
      start_period: 24h

    # Reap child processes and forward signals correctly.
    init: true

    # Runtime environment comes from this file; Compose interpolation additionally
    # requires: docker compose --env-file ./github-to-nas-backup.env ...
    env_file:
      - ./github-to-nas-backup.env

    volumes:
      - ${BACKUP_HOST_PATH:?BACKUP_HOST_PATH must be set}:/data
      - ./backup-loop.sh:/backup-loop.sh:ro
      - ./verify-backups.sh:/verify-backups.sh:ro

    secrets:
      - github_token

    entrypoint:
      - /bin/sh
      - /backup-loop.sh

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_grace_period: 2m

secrets:
  github_token:
    file: ./secrets/github_token
